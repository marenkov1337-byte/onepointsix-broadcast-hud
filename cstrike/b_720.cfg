// ============================================================
// OnePointSix Broadcast HUD - 1280x720 - Fresh install
// Minimal configuration for the current broadcast HUD
// ============================================================

echo "Loading OnePointSix 1280x720 Broadcast HUD"

// --- Custom HUD ---
hltv_draw_healthbars "1"
hltv_draw_topbar "1"
hltv_enable_roundtimer "1"
hltv_c4timer "35"

// --- Fonts ---
hltv_healthbar_use_engine_font "0"
hltv_general_font "Verdana"
hltv_healthbar_font "Verdana"
hltv_roundtimer_font "Verdana"
hltv_teamscore_font "Verdana"
hltv_teamnames_font "Verdana"
hltv_clanscore_font "Verdana"

hltv_general_font_size "11"
hltv_healthbar_font_size "12"
hltv_roundtimer_font_size "18"
hltv_teamscore_font_size "22"
hltv_teamnames_font_size "15"
hltv_clanscore_font_size "24"
hltv_healthbar_font_yoffset "0"

// --- Top scoreboard ---
hltv_topbar_xpos "350"
hltv_topbar_ypos "8"
hltv_topbar_width "580"
hltv_topbar_height "46"

hltv_roundtimer_xpos "640"
hltv_roundtimer_ypos "36"

hltv_team_1_name "Terrorists"
hltv_team_2_name "Counter-Terrorists"
hltv_team_1_name_xpos "440"
hltv_team_1_name_ypos "35"
hltv_team_2_name_xpos "840"
hltv_team_2_name_ypos "35"

hltv_team_1_clanscore_xpos "557"
hltv_team_1_clanscore_ypos "37"
hltv_team_2_clanscore_xpos "722"
hltv_team_2_clanscore_ypos "37"

// Hide unused raw team-score labels
hltv_team_1_teamscore_xpos "-100"
hltv_team_1_teamscore_ypos "-100"
hltv_team_2_teamscore_xpos "-100"
hltv_team_2_teamscore_ypos "-100"

// --- Minimap: ALWAYS ON ---
hltv_draw_minimap "1"
hltv_minimap_xpos "10"
hltv_minimap_ypos "8"
hltv_minimap_size "330"

// --- Bottom player cards ---
hltv_t_1_xpos "10"
hltv_t_1_ypos "614"
hltv_t_2_xpos "130"
hltv_t_2_ypos "614"
hltv_t_3_xpos "250"
hltv_t_3_ypos "614"
hltv_t_4_xpos "370"
hltv_t_4_ypos "614"
hltv_t_5_xpos "490"
hltv_t_5_ypos "614"

hltv_ct_1_xpos "674"
hltv_ct_1_ypos "614"
hltv_ct_2_xpos "794"
hltv_ct_2_ypos "614"
hltv_ct_3_xpos "914"
hltv_ct_3_ypos "614"
hltv_ct_4_xpos "1034"
hltv_ct_4_ypos "614"
hltv_ct_5_xpos "1154"
hltv_ct_5_ypos "614"

// --- Native CS/HLTV HUD ---
hud_deathnotice_time "6"
spec_scoreboard "0"
spec_drawstatus_internal "0"
spec_drawstatus "0"

// --- Crosshair ---
cl_crosshair_size "1"
cl_crosshair_color "0 255 0"
cl_crosshair_translucent "0"
cl_dynamiccrosshair "0"

// --- Spectator player hotkeys (match minimap numbers) ---
bind "1" "hltv_spec_slot 1"
bind "2" "hltv_spec_slot 2"
bind "3" "hltv_spec_slot 3"
bind "4" "hltv_spec_slot 4"
bind "5" "hltv_spec_slot 5"
bind "6" "hltv_spec_slot 6"
bind "7" "hltv_spec_slot 7"
bind "8" "hltv_spec_slot 8"
bind "9" "hltv_spec_slot 9"
bind "0" "hltv_spec_slot 10"

// --- Spectator / HUD controls ---
bind "home" "overview"
bind "i"    "hltv_reload"

alias overview "overview1"
alias overview1 "spec_mode 5; alias overview overview2"
alias overview2 "spec_mode 4; alias overview overview1"

// HLTV interpolation
ex_inter "0.1"

// Apply overlay settings
hltv_reload

echo "OnePointSix Broadcast HUD loaded - minimap ON"
